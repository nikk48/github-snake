name: Generate contribution snake

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: nikk48
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SVGs to output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global credential.helper '!gh auth git-credential'
          git clone --depth 1 "https://github.com/${REPOSITORY}.git" published
          cd published
          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git fetch --depth 1 origin output
            git checkout -B output FETCH_HEAD
          else
            git checkout --orphan output
            git rm -rf .
          fi
          cp ../dist/github-snake.svg ../dist/github-snake-dark.svg .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-snake.svg github-snake-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update contribution snake'
          git push origin output
